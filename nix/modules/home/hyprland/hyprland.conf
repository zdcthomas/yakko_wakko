$browser={{firefox}}
$file_explorer={{thunar}}
$bluetooth_app={{bluetooth_app}}
$launcher={{rofi}}
$launcher_alt={{yofi}}
$mainMod={{mainMod}}
$grimblast={{grimblast}}
$terminal={{wezterm}}
$alt-terminal={{alacritty}}
$cliphist={{cliphist}}
$cliphist_pick={{cliphistPick}}

# exec-once = nm-applet &
# exec-once = blueman-applet
# exec-once = {{wlsunset}}
# exec-once = {{udiskie}}
# exec-once = xwaylandvideobridge
# exec-once = wl-paste --type text --watch $cliphist store #Stores only text data
# exec-once = wl-paste --type image --watch $cliphist store #Stores only image data

# exec-once=hyprctl setcursor phinger-cursors-dark, 11
windowrule = animation slide, class:^(.*blueman.*)$
windowrule = float, class:^(.*blueman.*)$
windowrule = center, class:^(.*blueman.*)$

decoration {
  blur {
    ignore_opacity=true
    new_optimizations=true
    passes=1
    size=5
    xray=true
  }
  # col.shadow=0x99161925
  # col.shadow_inactive=0x55161925
  rounding=10
  # shadow_ignore_window=true
}

# replaces the removed decoration:blurls option
layerrule = blur, wofi
layerrule = blur, tofi
layerrule = blur, launcher
layerrule = blur, rofi


# toolkit-specific scale
# env = GDK_SCALE,2

dwindle {
  preserve_split=yes
  pseudotile=yes
  # force_split=2
}

general {
  border_size=2
  col.active_border=rgba({{col.base0C}}FF) rgba({{col.base0F}}FF) 45deg
  # base00 is the window background, so an inactive border drawn in it is
  # invisible; base03 keeps unfocused windows separated.
  col.inactive_border=rgba({{col.base03}}aa)

  gaps_in=5
  gaps_out=10
  layout=master
}

# hypridle locks on the lock-session signal that suspend emits
bindl=,switch:[Lid Switch],exec,systemctl suspend
# bindl=,switch:on:[Lid Switch],exec,hyprlock
# bindl=,switch:on:[Lid Switch],exec,hyprctl dispatch dpms on
# bindl=,switch:off:[Lid Switch],exec,hyprctl dispatch dpms off
bind = $mainMod SHIFT, G,exec,hyprctl --batch "keyword general:gaps_out 10;keyword general:gaps_in 5"
bind = $mainMod , G,exec,hyprctl --batch "keyword general:gaps_out 0;keyword general:gaps_in 0"

gesture = 3, horizontal, workspace
gesture = 4, up, fullscreen
gesture = 4, down, close
# gestures {
#   workspace_swipe=on
# }

input {
  touchpad {
    natural_scroll=no
    tap-to-click=true
    disable_while_typing=true
    clickfinger_behavior=true
  }
  follow_mouse=1
  kb_layout=us
  kb_options=caps:escape
  scroll_method="2fg"
}

master {
  # new_is_master=true
  inherit_fullscreen=true
  new_on_top=true
  orientation=left
}


bind = SUPER,              bracketleft,  workspace,                     m-1
bind = SUPER,              bracketright, workspace,                     m+1
bind = SUPER + CTRL,       n,            focusmonitor,                  r
bind = SUPER + CTRL,       p,            focusmonitor,                  l
bind = SUPER + CTRL,       h,            exec,                          $cliphist_pick
bind = SUPER + CTRL,       l,            exec,                          loginctl lock-session
bind = SUPER + SHIFT,      TAB,          focusmonitor,
bind = SUPER,              TAB,          focusurgentorlast,
bind = SUPER + SHIFT,      W,            killactive,
bind = SUPER + CTRL + ALT, Q,            exit,
bind = SUPER + ALT,        B,            exec,                          $bluetooth_app
bind = SUPER,              F,            fullscreen,
bind = SUPER + SHIFT,      Space,        togglefloating,
bind = SUPER + SHIFT,      m,            layoutmsg,                     swapwithmaster master
bind = SUPER,              D,            exec,                          $launcher
bind = SUPER + SHIFT,      P,            exec,                          $grimblast --notify copysave area
bind = SUPER,              P,            exec,                          $grimblast --notify copy area
bind = SUPER,              n,            exec,                          $terminal --class nmtui -e  nmtui
bind = SUPER + SHIFT,      d,            exec,                          $launcher_alt
bind = SUPER + ALT,        c,            exec,                          $hyprPickerCmd
bind = SUPER,              Return,       exec,                          $terminal
bind = SUPER + SHIFT,      Return,       exec,                          $alt-terminal
bind = SUPER,              b,            exec,                          $browser
bind = SUPER,              o,            exec,                          $file_explorer
bind = SUPER + CTRL,       left,         movecurrentworkspacetomonitor, l
bind = SUPER + CTRL,       right,        movecurrentworkspacetomonitor, r
bind = SUPER,              h,            movefocus,                     l
bind = SUPER,              l,            movefocus,                     r
bind = SUPER,              k,            movefocus,                     u
bind = SUPER,              j,            movefocus,                     d
bind = SUPER+SHIFT,        h,            movewindow,                    l
bind = SUPER+SHIFT,        l,            movewindow,                    r
bind = SUPER+SHIFT,        k,            movewindow,                    u
bind = SUPER+SHIFT,        j,            movewindow,                    d
bind = SUPER+SHIFT,        R,            exec,                          pkill waybar && waybar &

{{workspaceBindings}}

bind   = SUPER + SHIFT, braceleft, focusmonitor, l
bind   = SUPER + SHIFT, braceright, focusmonitor, r
bind   = SUPER,         R, submap, resize
bindl  =,               XF86AudioMute,    exec, {{speakerMute}}
bindl  =,               XF86AudioMicMute, exec, {{micMute}}
bindle =,               XF86AudioLowerVolume, exec, {{volumeLower}}
bindle =,               XF86AudioRaiseVolume, exec, {{volumeRaise}}
bindle = SHIFT,         XF86AudioLowerVolume, exec, {{inputLower}}
bindle = SHIFT,         XF86AudioRaiseVolume, exec, {{inputRaise}}
bindle =,               XF86MonBrightnessDown, exec, {{brightnessLower}}
bindle =,               XF86MonBrightnessUp,   exec, {{brightnessRaise}}
bindm  = SUPER,         mouse:272, movewindow
bindm  = SUPER,         mouse:273, resizewindow

windowrule=opacity 0.0 override 0.0 override, class:^(xwaylandvideobridge)$
windowrule=noanim,                            class:^(xwaylandvideobridge)$
windowrule=nofocus,                           class:^(xwaylandvideobridge)$
windowrule=noinitialfocus,                    class:^(xwaylandvideobridge)$
windowrule=noblur,                            class:^(xwaylandvideobridge)$
windowrule=noshadow,                          class:^(xwaylandvideobridge)$
# windowrule=workspace 3,                       title:^(.*Discord.*)$
# windowrule=workspace 4,                       title:^(.*1Password.*)$
windowrule=idleinhibit focus,                 class:^(mpv|.+exe)$
windowrule=idleinhibit focus,                 class:^(firefox)$, title:^(.*YouTube.*)$
windowrule=idleinhibit fullscreen,            class:^(firefox)$
windowrule=float,                             class:(pavucontrol),
windowrule=float,                             class:(nmtui),
windowrule=center,                            class:(nmtui),
windowrule=float,                             class:(imv),
windowrule=center,                            class:(Godot),
windowrule=float,                             class:(Godot),
windowrule=center,                            title:(Godot),
windowrule=float,                             title:(Godot),

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
# No GTK_THEME here: the env var outranks gtk-3.0/settings.ini, so setting it
# would override the theme the `gtk` block in ./default.nix manages.

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsIn, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, slide
    animation = border, 1, 10, myBezier
    animation = borderangle, 1, 100, default, once
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

submap = resize
binde  = , l, resizeactive, 10 0
binde  = , h, resizeactive, -10 0
binde  = , k, resizeactive, 0 -10
binde  = , j, resizeactive, 0 10
bind   = , escape, submap, reset
submap = reset

windowrule   = float,title:^(nm-connection-editor)

# dialog
windowrule = float,title:^(Open File)(.*)$
windowrule = float,title:^(Open Folder)(.*)$
windowrule = float,title:^(Open)$
windowrule = float,title:^(Save As)(.*)$
windowrule = float,title:^(Library)(.*)$
windowrule = float,title:^(Choose Files)$
windowrule = float,title:^(Confirm to replace files)$
windowrule = float,title:^(File Operation Progress)$

monitor=eDP-1,2560x1600@165.00000,0x0,1.6
monitor=DP-2,2560x1440@60,2560x0,1

# # workspace binding
# workspace=DP-2,1
# workspace=2, monitor:DP-2
# workspace=3, monitor:eDP-1
# workspace=4, monitor:eDP-1
plugin {
    hyprwinwrap {
        # class is an EXACT match and NOT a regex!
        class = bg-wallpaper
    }

    # split-monitor-workspaces {
    #     count = 5
    #     keep_focused = 1
    #     enable_notifications = 1
    #     enable_persistent_workspaces = 0
    # }
}

