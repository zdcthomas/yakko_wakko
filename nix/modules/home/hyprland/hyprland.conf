$browser={{firefox}}
$file_explorer={{thunar}}
$bluetooth_app={{bluetooth_app}}
$launcher={{rofi}}
$launcher_alt={{yofi}}
$mainMod={{mainMod}}
$grimblast={{grimblast}}
$terminal={{wezterm}}
$alt-terminal={{alacritty}}
$cliphist={{cliphist}}
$cliphist_pick={{cliphistPick}}

# exec-once = nm-applet &
# exec-once = blueman-applet
# exec-once = {{wlsunset}}
# exec-once = {{udiskie}}
# exec-once = xwaylandvideobridge
# exec-once = wl-paste --type text --watch $cliphist store #Stores only text data
# exec-once = wl-paste --type image --watch $cliphist store #Stores only image data

# exec-once=hyprctl setcursor phinger-cursors-dark, 11
windowrule = animation slide, class:^(.*blueman.*)$
windowrule = float, class:^(.*blueman.*)$
windowrule = center, class:^(.*blueman.*)$
# nmgui, which the bar's network pill opens, is a picker, not a work window.
windowrule = float, class:^(com\.network\.manager)$
windowrule = center, class:^(com\.network\.manager)$

decoration {
  blur {
    ignore_opacity=true
    new_optimizations=true
    passes=1
    size=5
    xray=true
  }
  # col.shadow=0x99161925
  # col.shadow_inactive=0x55161925
  rounding=10
  # shadow_ignore_window=true
}

# replaces the removed decoration:blurls option
layerrule = blur, wofi
layerrule = blur, tofi
layerrule = blur, launcher
layerrule = blur, rofi


# toolkit-specific scale
# env = GDK_SCALE,2

dwindle {
  preserve_split=yes
  pseudotile=yes
  # force_split=2
}

general {
  border_size=2
  col.active_border=rgba({{col.base0C}}FF) rgba({{col.base0F}}FF) 45deg
  # base00 is the window background, so an inactive border drawn in it is
  # invisible; base03 keeps unfocused windows separated.
  col.inactive_border=rgba({{col.base03}}aa)

  gaps_in=5
  gaps_out=10
  layout=master
}

# hypridle locks on the lock-session signal that suspend emits
bindl=,switch:[Lid Switch],exec,systemctl suspend
# bindl=,switch:on:[Lid Switch],exec,hyprlock
# bindl=,switch:on:[Lid Switch],exec,hyprctl dispatch dpms on
# bindl=,switch:off:[Lid Switch],exec,hyprctl dispatch dpms off
# bindd = MODS, key, description, dispatcher, args. The description is what the
# keybind menu (SUPER + /) shows and searches, so it must not contain a comma.
# Binds without a description (plain bind) stay out of the menu.
bindd = $mainMod SHIFT, G, Gaps on, exec,hyprctl --batch "keyword general:gaps_out 10;keyword general:gaps_in 5"
bindd = $mainMod , G, Gaps off, exec,hyprctl --batch "keyword general:gaps_out 0;keyword general:gaps_in 0"

gesture = 3, horizontal, workspace
gesture = 4, up, fullscreen
gesture = 4, down, close
# gestures {
#   workspace_swipe=on
# }

input {
  touchpad {
    natural_scroll=no
    tap-to-click=true
    disable_while_typing=true
    clickfinger_behavior=true
  }
  follow_mouse=1
  kb_layout=us
  kb_options=caps:escape
  scroll_method="2fg"
}

master {
  # new_is_master=true
  inherit_fullscreen=true
  new_on_top=true
  orientation=left
}


bindd = SUPER,              slash,        Keybind menu,                       exec,                          {{keybindMenu}}
bindd = SUPER,              bracketleft,  Previous workspace on this monitor, workspace,                     m-1
bindd = SUPER,              bracketright, Next workspace on this monitor,     workspace,                     m+1
bindd = SUPER + CTRL,       n,            Focus monitor to the right,         focusmonitor,                  r
bindd = SUPER + CTRL,       p,            Focus monitor to the left,          focusmonitor,                  l
bindd = SUPER + CTRL,       h,            Clipboard history,                  exec,                          $cliphist_pick
bindd = SUPER + CTRL,       l,            Lock screen,                        exec,                          loginctl lock-session
bindd = SUPER + SHIFT,      TAB,          Focus other monitor,                focusmonitor,
bindd = SUPER,              TAB,          Focus urgent or last window,        focusurgentorlast,
bindd = SUPER + SHIFT,      W,            Close window,                       killactive,
bindd = SUPER + CTRL + ALT, Q,            Exit Hyprland,                      exit,
bindd = SUPER + ALT,        B,            Bluetooth settings,                 exec,                          $bluetooth_app
bindd = SUPER,              F,            Fullscreen,                         fullscreen,
bindd = SUPER + SHIFT,      Space,        Toggle floating,                    togglefloating,
bindd = SUPER + SHIFT,      m,            Swap window with master,            layoutmsg,                     swapwithmaster master
bindd = SUPER,              D,            App launcher,                       exec,                          $launcher
bindd = SUPER + SHIFT,      P,            Screenshot area to file and clipboard, exec,                       $grimblast --notify copysave area
bindd = SUPER,              P,            Screenshot area to clipboard,       exec,                          $grimblast --notify copy area
bindd = SUPER,              n,            Network settings (nmtui),           exec,                          $terminal --class nmtui -e  nmtui
bindd = SUPER + SHIFT,      d,            App launcher (yofi),                exec,                          $launcher_alt
bindd = SUPER + ALT,        c,            Color picker,                       exec,                          $hyprPickerCmd
bindd = SUPER,              Return,       Terminal (WezTerm),                 exec,                          $terminal
bindd = SUPER + SHIFT,      Return,       Terminal (Alacritty),               exec,                          $alt-terminal
bindd = SUPER,              b,            Browser,                            exec,                          $browser
bindd = SUPER,              o,            File manager,                       exec,                          $file_explorer
bindd = SUPER + CTRL,       left,         Move workspace to left monitor,     movecurrentworkspacetomonitor, l
bindd = SUPER + CTRL,       right,        Move workspace to right monitor,    movecurrentworkspacetomonitor, r
bindd = SUPER,              h,            Focus window left,                  movefocus,                     l
bindd = SUPER,              l,            Focus window right,                 movefocus,                     r
bindd = SUPER,              k,            Focus window up,                    movefocus,                     u
bindd = SUPER,              j,            Focus window down,                  movefocus,                     d
bindd = SUPER+SHIFT,        h,            Move window left,                   movewindow,                    l
bindd = SUPER+SHIFT,        l,            Move window right,                  movewindow,                    r
bindd = SUPER+SHIFT,        k,            Move window up,                     movewindow,                    u
bindd = SUPER+SHIFT,        j,            Move window down,                   movewindow,                    d
bindd = SUPER+SHIFT,        R,            Restart the bar,                    exec,                          {{{restartBar}}}

{{workspaceBindings}}

bindd  = SUPER + SHIFT, braceleft,  Focus monitor to the left,  focusmonitor, l
bindd  = SUPER + SHIFT, braceright, Focus monitor to the right, focusmonitor, r

# XR glasses (Viture Beast). Workspaces 6-10 live on the glasses (rules below).
bindd  = SUPER + ALT,   l,     Send window to glasses,             movewindow, mon:{{glasses}}
bindd  = SUPER + ALT,   h,     Send window to laptop screen,       movewindow, mon:eDP-1
bindd  = SUPER + ALT,   Space, Swap laptop and glasses workspaces, swapactiveworkspaces, eDP-1 {{glasses}}
# l (locked) so it still works on the lock screen.
bindld = SUPER + ALT,   g,     Glasses only (laptop screen off/on), exec, {{glassesOnly}}
bindd  = SUPER,         R, Resize mode (hjkl then Escape), submap, resize
bindld =,               XF86AudioMute,    Mute speakers,       exec, {{speakerMute}}
bindld =,               XF86AudioMicMute, Mute microphone,     exec, {{micMute}}
bindled =,              XF86AudioLowerVolume, Volume down,     exec, {{volumeLower}}
bindled =,              XF86AudioRaiseVolume, Volume up,       exec, {{volumeRaise}}
bindled = SHIFT,        XF86AudioLowerVolume, Microphone volume down, exec, {{inputLower}}
bindled = SHIFT,        XF86AudioRaiseVolume, Microphone volume up,   exec, {{inputRaise}}
bindled =,              XF86MonBrightnessDown, Screen brightness down, exec, {{brightnessLower}}
bindled =,              XF86MonBrightnessUp,   Screen brightness up,   exec, {{brightnessRaise}}
bindm  = SUPER,         mouse:272, movewindow
bindm  = SUPER,         mouse:273, resizewindow

windowrule=opacity 0.0 override 0.0 override, class:^(xwaylandvideobridge)$
windowrule=noanim,                            class:^(xwaylandvideobridge)$
windowrule=nofocus,                           class:^(xwaylandvideobridge)$
windowrule=noinitialfocus,                    class:^(xwaylandvideobridge)$
windowrule=noblur,                            class:^(xwaylandvideobridge)$
windowrule=noshadow,                          class:^(xwaylandvideobridge)$
# windowrule=workspace 3,                       title:^(.*Discord.*)$
# windowrule=workspace 4,                       title:^(.*1Password.*)$
windowrule=idleinhibit focus,                 class:^(mpv|.+exe)$
windowrule=idleinhibit focus,                 class:^(firefox)$, title:^(.*YouTube.*)$
windowrule=idleinhibit fullscreen,            class:^(firefox)$
windowrule=float,                             class:(pavucontrol),
windowrule=float,                             class:(nmtui),
windowrule=center,                            class:(nmtui),
windowrule=float,                             class:(imv),
windowrule=center,                            class:(Godot),
windowrule=float,                             class:(Godot),
windowrule=center,                            title:(Godot),
windowrule=float,                             title:(Godot),

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
# No GTK_THEME here: the env var outranks gtk-3.0/settings.ini, so setting it
# would override the theme the `gtk` block in ./default.nix manages.

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsIn, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, slide
    animation = border, 1, 10, myBezier
    animation = borderangle, 1, 100, default, once
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

submap = resize
binde  = , l, resizeactive, 10 0
binde  = , h, resizeactive, -10 0
binde  = , k, resizeactive, 0 -10
binde  = , j, resizeactive, 0 10
bind   = , escape, submap, reset
submap = reset

windowrule   = float,title:^(nm-connection-editor)

# dialog
windowrule = float,title:^(Open File)(.*)$
windowrule = float,title:^(Open Folder)(.*)$
windowrule = float,title:^(Open)$
windowrule = float,title:^(Save As)(.*)$
windowrule = float,title:^(Library)(.*)$
windowrule = float,title:^(Choose Files)$
windowrule = float,title:^(Confirm to replace files)$
windowrule = float,title:^(File Operation Progress)$

monitor=eDP-1,2560x1600@165.00000,0x0,1.6
monitor=DP-2,2560x1440@60,2560x0,1
# XR glasses on any port. "preferred" picks up 1920x1200/120 Hz once that
# mode is switched on in the glasses' own menu.
monitor={{glasses}},preferred,auto-right,1

# Workspaces 6-10 open on the glasses when they are connected, and on the
# focused monitor when they are not. The glasses start on 6.
workspace = 6,  monitor:{{glasses}}, default:true
workspace = 7,  monitor:{{glasses}}
workspace = 8,  monitor:{{glasses}}
workspace = 9,  monitor:{{glasses}}
workspace = 10, monitor:{{glasses}}

# # workspace binding
# workspace=DP-2,1
# workspace=2, monitor:DP-2
# workspace=3, monitor:eDP-1
# workspace=4, monitor:eDP-1
plugin {
    hyprwinwrap {
        # class is an EXACT match and NOT a regex!
        class = bg-wallpaper
    }

    # split-monitor-workspaces {
    #     count = 5
    #     keep_focused = 1
    #     enable_notifications = 1
    #     enable_persistent_workspaces = 0
    # }
}

